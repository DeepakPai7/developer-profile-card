<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="profile-card">
    
    <!-- BONUS: Avatar container setup for the status dot -->
    <div class="avatar-container">
      <!-- You can replace this image link with your photo later -->
      <img src="myphoto.jpeg" alt="Profile Picture" class="avatar">
      <span class="status-dot" title="Available for Work"></span>
    </div>

    <!-- Personal Info -->
    <h2 class="name">Deepak Pai</h2>
    <p class="title">CSE Student & Aspiring Full Stack Developer</p>
    <p class="bio">CSE student passionate about programming and web development,
      currently learning to build responsive and useful web applications.</p>
 
    <!-- Skills -->
    <div class="skills">
      <span class="badge">C</span>
      <span class="badge">C++</span>
      <span class="badge">Python</span>
      <span class="badge">HTML</span>
      <span class="badge">CSS</span>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <a href="https://github.com/DeepakPai7/" target="_blank" class="btn btn-primary">GitHub</a>
      <a href="https://www.linkedin.com/in/deepak-pai-652059389/" target="_blank" class="btn btn-secondary">LinkedIn</a>
    </div>

  </div>
</body>
</html>
